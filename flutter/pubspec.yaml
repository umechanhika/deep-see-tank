name: deep_see_tank
description: "深海水槽放置ゲームの Flutter Scene 版。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  hooks: ^2.2.0
  shared_preferences: ^2.5.6
  vector_math: ^2.4.4
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  uses-material-design: true

  # 画面に出す文字だけを含む部分フォント。tool/subset_fonts.py で作る。
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Subset.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Subset.ttf
